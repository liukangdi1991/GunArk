services:
  trend-radar:
    build:
      context: .
      dockerfile: Dockerfile
    image: trend-radar:latest
    container_name: trend-radar
    env_file:
      - ./deploy/.env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${APP_PORT:-8818}:8000"
    volumes:
      - ./deploy/data/db:/app/db
      - ./deploy/data/storage:/app/storage
      - ./deploy/configs.json:/app/configs.json
      - ./deploy/stocklist.csv:/app/stocklist.csv
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/market-data/status', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
