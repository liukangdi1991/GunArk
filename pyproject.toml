[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trendradar"
version = "2.0.0.dev0"
description = "TrendRadar V2 - A-stock quantitive selection system"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["trendradar*"]
