[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trendradar"
dynamic = ["version"]
description = "TrendRadar V2 - A-stock quantitive selection system"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["trendradar*"]

[tool.setuptools.dynamic]
version = {attr = "trendradar._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
