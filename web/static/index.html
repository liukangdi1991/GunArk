<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GunArk Web</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">G</div>
      <div>
        <h1>GunArk</h1>
        <p>A股日线量化工作台</p>
      </div>
    </div>

    <section class="panel">
      <h2>新建选股</h2>
      <form id="selection-form">
        <label>
          <span>选股日期</span>
          <input name="date" value="" placeholder="空表示最新交易日" inputmode="numeric">
        </label>
        <label>
          <span>选股策略</span>
          <select name="strategies" id="selection-strategy-select" multiple></select>
        </label>
        <button id="select-button" type="submit">执行选股</button>
      </form>
      <p id="selection-status-line" class="status-line"></p>
    </section>

    <section class="panel">
      <h2>新建回测</h2>
      <form id="backtest-form">
        <label>
          <span>开始日期</span>
          <input name="from" value="20260401" inputmode="numeric">
        </label>
        <label>
          <span>结束日期</span>
          <input name="to" value="20260410" inputmode="numeric">
        </label>
        <label>
          <span>选股策略</span>
          <select name="strategies" id="strategy-select" multiple></select>
        </label>
        <label>
          <span>资金模式</span>
          <select name="mode">
            <option value="unlimited_cash">unlimited_cash</option>
            <option value="realistic">realistic</option>
          </select>
        </label>
        <label>
          <span>每票金额</span>
          <input name="cash_per_trade" value="50000" inputmode="decimal">
        </label>
        <button id="run-button" type="submit">执行回测</button>
      </form>
      <p id="status-line" class="status-line"></p>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>选股历史</h2>
        <button id="refresh-selections" type="button" class="ghost-button">刷新</button>
      </div>
      <div id="selection-list" class="run-list"></div>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>回测历史</h2>
        <button id="refresh-runs" type="button" class="ghost-button">刷新</button>
      </div>
      <div id="run-list" class="run-list"></div>
    </section>
  </aside>

  <main class="content">
    <section class="report-shell">
      <div class="report-head">
        <div>
          <p class="eyebrow">Backtest Report</p>
          <h2 id="report-title">选择一次回测</h2>
        </div>
        <div id="report-meta" class="report-meta"></div>
      </div>

      <div id="summary-cards" class="summary-cards"></div>

      <section class="block">
        <h3>策略对比</h3>
        <div id="summary-table"></div>
      </section>

      <section class="block">
        <h3>选股结果</h3>
        <div id="selection-results-table"></div>
      </section>

      <section class="block">
        <h3>策略条件快照</h3>
        <div id="strategy-snapshots"></div>
      </section>

      <section class="block">
        <h3>交易明细</h3>
        <div id="trades-table"></div>
      </section>

      <section class="block">
        <h3>跳过记录</h3>
        <div id="skips-table"></div>
      </section>

      <section class="block">
        <h3>资金曲线数据</h3>
        <div id="equity-table"></div>
      </section>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
